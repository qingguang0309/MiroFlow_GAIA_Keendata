# gpt-6.1-sol arm via OpenRouter (openai/gpt-6.1-sol) for main agent and agent-worker.
# Based on agent_gaia-validation-keendata-sol-or.yaml (E32), with the opus arm's current tool servers
# (images/video on Gemini per E38, audio on OpenRouter per E37) and the same G3 turn caps.
# Aux roles (hint / answer-type / final-answer extraction / reasoning) unchanged: kimi-k3 via KIMI_* env.
# Created 2026-10-15 to re-answer round2 tasks whose opus answers differ from the current submission (E47).
defaults:
  - benchmark: gaia-validation
  - override hydra/job_logging: none
  - _self_  # Allow defining variables at the top of this file


main_agent:
  prompt_class: MainAgentPrompt_GAIA
  llm:
    provider_class: "GPT5OpenAIClient"
    model_name: "openai/gpt-6.1-sol"
    async_client: true
    temperature: 1.0
    top_p: 1.0
    min_p: 0.0
    top_k: -1
    max_tokens: 128000
    reasoning_effort: "high"
    openai_api_key: "${oc.env:OPENROUTER_API_KEY,???}"
    openai_base_url: "${oc.env:OPENROUTER_BASE_URL,https://openrouter.ai/api/v1}"
    openrouter_provider: ""
    disable_cache_control: true
    keep_tool_result: -1
    oai_tool_thinking: false

  tool_config:
    - tool-reasoning

  max_turns: 30  # G3 cap (same as kimi/opus arms): main agent max observed 12 turns; stops E27-style runaways
  max_tool_calls_per_turn: 10  # Maximum number of tool calls per turn

  input_process:
    hint_generation: true
    hint_llm_base_url: "${oc.env:HINT_LLM_BASE_URL,https://api.openai.com/v1}"
  output_process:
    final_answer_extraction: true
    final_answer_llm_base_url: "${oc.env:FINAL_ANSWER_LLM_BASE_URL,https://api.openai.com/v1}"

  openai_api_key: "${oc.env:KIMI_API_KEY,???}" # aux roles (hint / answer-type / final-answer extraction) -> kimi-k3 via Moonshot
  add_message_id: true
  keep_tool_result: -1
  chinese_context: "${oc.env:CHINESE_CONTEXT,false}"


sub_agents:
  agent-worker:
    prompt_class: SubAgentWorkerPrompt
    llm:
      provider_class: "GPT5OpenAIClient"
      model_name: "openai/gpt-6.1-sol"
      async_client: true
      temperature: 1.0
      top_p: 1.0
      min_p: 0.0
      top_k: -1
      max_tokens: 128000
      reasoning_effort: "medium"
      openai_api_key: "${oc.env:OPENROUTER_API_KEY,???}"
      openai_base_url: "${oc.env:OPENROUTER_BASE_URL,https://openrouter.ai/api/v1}"
      openrouter_provider: ""
      disable_cache_control: true
      keep_tool_result: -1
      oai_tool_thinking: false

    tool_config:
      - tool-searching
      - tool-image-video-gemini  # E38: image questions and video on Gemini
      - tool-reading
      - tool-code
      - tool-audio-openrouter  # E37: audio via openai/gpt-audio-mini on OpenRouter

    max_turns: 150  # G3 cap (same as kimi/opus arms): sub-agent sessions max observed 63 turns
    max_tool_calls_per_turn: 10  # Maximum number of tool calls per turn


# Can define some top-level or default parameters here
output_dir: logs/
data_dir: "${oc.env:DATA_DIR,data}"  # Points to where data is stored
