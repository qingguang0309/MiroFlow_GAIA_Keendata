# Gemini 3.1 Pro arm via OpenRouter (google/gemini-3.1-pro-preview) for main agent and agent-worker, driven by
# ClaudeOpenRouterClient (OpenAI-compatible chat, text-tag tool calls). Differs from the opus config only in model,
# no Anthropic provider pin and no Anthropic cache_control. Created 2026-10-20 to re-answer 8f2e558f (E50).
defaults:
  - benchmark: gaia-validation
  - override hydra/job_logging: none
  - _self_  # Allow defining variables at the top of this file


main_agent:
  prompt_class: MainAgentPrompt_GAIA
  llm: 
    provider_class: "ClaudeOpenRouterClient"
    model_name: "google/gemini-3.1-pro-preview"
    async_client: true
    temperature: 1.0
    top_p: 1.0
    min_p: 0.0
    top_k: -1
    max_tokens: 32000
    reasoning_effort: "high"
    openai_api_key: "${oc.env:OPENAI_API_KEY,???}"
    openai_base_url: "${oc.env:OPENAI_BASE_URL,https://api.openai.com/v1}"
    openrouter_api_key: "${oc.env:OPENROUTER_API_KEY,???}"
    openrouter_base_url: "${oc.env:OPENROUTER_BASE_URL,https://openrouter.ai/api/v1}"
    openrouter_provider: ""  # no pin: OpenRouter routes Gemini to Google (verified 2026-10-20)
    disable_cache_control: true
    keep_tool_result: -1
    oai_tool_thinking: false
  
  tool_config:
    - tool-reasoning

  max_turns: 30  # Maximum number of turns for main agent execution  # G3: f3 opus main max observed 12; cap 30 = 0/69 correct tasks affected
  max_tool_calls_per_turn: 10  # Maximum number of tool calls per turn
  
  input_process:
    hint_generation: true
    hint_llm_base_url: "${oc.env:HINT_LLM_BASE_URL,https://api.openai.com/v1}"
  output_process:
    final_answer_extraction: true
    final_answer_llm_base_url: "${oc.env:FINAL_ANSWER_LLM_BASE_URL,https://api.openai.com/v1}"

  openai_api_key: "${oc.env:KIMI_API_KEY,???}" # aux roles (hint / answer-type / final-answer extraction) -> kimi-k3 via Moonshot
  add_message_id: true
  keep_tool_result: -1
  chinese_context: "${oc.env:CHINESE_CONTEXT,false}"


sub_agents:
  agent-worker:
    prompt_class: SubAgentWorkerPrompt
    llm: 
      provider_class: "ClaudeOpenRouterClient"
      model_name: "google/gemini-3.1-pro-preview"
      async_client: true
      temperature: 1.0
      top_p: 1.0
      min_p: 0.0
      top_k: -1
      max_tokens: 32000
      reasoning_effort: "medium"
      openai_api_key: "${oc.env:OPENAI_API_KEY,???}"
      openai_base_url: "${oc.env:OPENAI_BASE_URL,https://api.openai.com/v1}"
      openrouter_api_key: "${oc.env:OPENROUTER_API_KEY,???}"
      openrouter_base_url: "${oc.env:OPENROUTER_BASE_URL,https://openrouter.ai/api/v1}"
      openrouter_provider: ""  # no pin: OpenRouter routes Gemini to Google (verified 2026-10-20)
      disable_cache_control: true
      keep_tool_result: -1
      oai_tool_thinking: false
    
    tool_config:
      - tool-searching
      - tool-image-video-gemini  # E38: image questions and video on Gemini 3.1 Pro (kimi-k3 took minutes per image)
      - tool-reading
      - tool-code
      - tool-audio-openrouter  # E37: server tool-audio via openai/gpt-audio-mini on OpenRouter; the keendata router has no audio model

    max_turns: 150  # Maximum number of turns for main agent execution  # G3: f3 opus sub-agent per-session max 63; cap 150 = 0/64 correct sessions affected, stops E27-style runaways
    max_tool_calls_per_turn: 10  # Maximum number of tool calls per turn


# Can define some top-level or default parameters here
output_dir: logs/
data_dir: "${oc.env:DATA_DIR,data}"  # Points to where data is stored

